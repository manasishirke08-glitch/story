<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you 🖤</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120a10;--bg2:#2a1020;--rose:#e0607e;--blush:#f7c6d0;--gold:#e8c27a;--ink:#fbeef1;--soft:#b99aa6;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 70%);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;overflow-x:hidden}
.hand{font-family:'Caveat','Segoe Script',cursive}
section{display:none;min-height:100%;padding:28px 22px 60px;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:520px;margin:0 auto}
section.on{display:flex;animation:in .9s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:2.3rem;line-height:1.15;margin:.2em 0 .4em;font-weight:700}
p{margin:.5em 0;line-height:1.5}
.sm{color:var(--soft);font-size:1rem}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:.7em 1.8em;color:#2a0b17;background:var(--blush);font-weight:700;font-size:1.1rem}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button.ghost{background:transparent;color:var(--blush);border:1.5px solid var(--blush)}
#pw{display:flex;gap:10px;margin:18px 0 6px}
input.code{font:inherit;font-size:1.6rem;letter-spacing:.3em;text-align:center;width:11em;max-width:70vw;padding:.5em;border-radius:14px;border:1.5px solid var(--soft);background:#1d0f17;color:var(--ink)}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#btns{position:relative;height:120px;width:100%;margin-top:26px}
#btns button{position:absolute;top:10px}
#yes{left:calc(50% - 110px)}
#no{left:calc(50% + 10px);transition:all .25s}
.reason{font-size:1.7rem;min-height:5.5em;display:flex;align-items:center;justify-content:center;padding:0 6px}
.reason.pop{animation:in .8s}
.dots{display:flex;gap:7px;margin:16px 0 22px}
.dots i{width:8px;height:8px;border-radius:50%;background:#4a2a38}
.dots i.f{background:var(--rose)}
.photo{width:min(300px,78vw);border-radius:6px;background:#fbeef1;padding:12px 12px 52px;position:relative;box-shadow:0 18px 40px #000a;transform:rotate(-2deg);margin:8px 0 18px}
.photo:nth-child(even){transform:rotate(2deg)}
.photo .im{width:100%;min-height:0;background:#3a1b2a center/cover;display:flex;align-items:center;justify-content:center;color:var(--blush);font-size:1rem;cursor:pointer}
.photo .cap{position:absolute;left:0;right:0;bottom:12px;color:#3a1b2a;font-size:1.5rem}
#gal{display:flex;flex-direction:column;align-items:center;width:100%}
.env{position:relative;width:min(320px,82vw);height:210px;margin:40px 0 20px;cursor:pointer}
.env .back,.env .front{position:absolute;inset:0;border-radius:8px;background:var(--rose)}
.env .front{background:linear-gradient(135deg,#c94a68 50%,transparent 50%),linear-gradient(225deg,#d85574 50%,transparent 50%);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);background:#cf4f6e;z-index:3}
.env .flap{position:absolute;left:0;right:0;top:0;height:60%;background:#b53c5b;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s .0s,z-index 0s .4s;z-index:4;border-radius:8px 8px 0 0}
.env .heart{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:2rem;z-index:5;transition:opacity .3s}
.env .letter{position:absolute;left:8%;right:8%;top:8%;height:80%;background:#fff7f0;border-radius:4px;z-index:2;transition:transform 1s .6s}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .heart{opacity:0}
.env.open .letter{transform:translateY(-40%)}
.paper{background:#fff7f0;color:#3a1b2a;border-radius:6px;padding:26px 22px;text-align:left;font-size:1.65rem;line-height:1.4;box-shadow:0 18px 40px #000a;width:100%;animation:in 1s}
.paper .sig{text-align:right;margin-top:10px}
#fin{display:none;flex-direction:column;align-items:center;width:100%;margin-top:26px}
#fin.on{display:flex;animation:in 1s}
#fall{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
#fall span{position:absolute;top:-30px;animation:fl linear forwards}
@keyframes fl{to{transform:translateY(110vh) rotate(40deg)}}
#mus{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:30;padding:.4em .8em;font-size:1rem}
.stage{position:relative;width:230px;height:290px;margin:0 auto -6px}
.girl{position:absolute;left:35px;bottom:0;width:160px;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.arm{transform-origin:101px 112px;animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bub{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--blush);color:#3a1b2a;border-radius:18px;padding:.35em .9em;font-size:1.35rem;line-height:1.15;white-space:nowrap;animation:in 1.2s .3s both}
.bub:after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--blush)}
.hh{position:absolute;bottom:90px;font-size:1.2rem;opacity:0;animation:fh 3.4s ease-in infinite}
.h1{left:150px}.h2{left:176px;animation-delay:1.1s}.h3{left:130px;animation-delay:2.2s}
@keyframes fh{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
.stage{width:330px;max-width:100%}
.girl{left:0}
.bub{left:0;transform:none}
.bub:after{left:70px;margin-left:0}
.h1{left:115px}.h2{left:140px}.h3{left:95px}
.pp{position:absolute;right:0;bottom:8px;width:150px;background:#fbeef1;padding:7px 7px 4px;border-radius:4px;transform:rotate(4deg);box-shadow:0 10px 24px #000a;color:#3a1b2a;font-size:1.3rem;line-height:1.1}
.pp img{width:100%;display:block}
.sad .hh{display:none}.sad .arm{animation:none;transform:rotate(-20deg)}
.bigcry{font-size:5rem;animation:sh .5s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button id="mus" class="ghost" aria-label="Music on or off">🎵 Music</button>
<div id="fall"></div>
<input type="file" id="file" accept="image/*" hidden>

<!-- 1. Secret entry -->
<section id="s1" class="on">
  <div class="stage" aria-hidden="true">
    <div class="bub hand">Hi Pranay! 🤭<br>Type our special date</div>
    <div class="pp"><img id="pimg" alt="Us"><div class="hand">us 🖤</div></div>
    <span class="hh h1">❤</span><span class="hh h2">🖤</span><span class="hh h3">❤</span>
    <svg class="girl" viewBox="0 0 160 230" xmlns="http://www.w3.org/2000/svg">
      <path d="M46 62C40 120 48 150 56 168L104 168C112 150 120 120 114 62Z" fill="#1c0f14"/>

      <path d="M60 112L57 130" stroke="#5b2230" stroke-width="9" stroke-linecap="round"/>
      <rect x="74" y="96" width="12" height="14" fill="#f3c9a5"/>

      <path d="M56 72C54 42 106 42 104 72C98 56 88 52 80 52C72 52 62 58 56 72Z" fill="#1c0f14"/>
      <g class="blink"><ellipse cx="71" cy="74" rx="2.6" ry="3.2" fill="#2a1218"/><ellipse cx="89" cy="74" rx="2.6" ry="3.2" fill="#2a1218"/></g>
      <circle cx="64" cy="82" r="4" fill="#f28fa0" opacity=".5"/><circle cx="96" cy="82" r="4" fill="#f28fa0" opacity=".5"/>
      <path d="M73 85Q80 92 87 85" stroke="#b4455c" stroke-width="2" fill="none" stroke-linecap="round"/>
      <g class="arm"><path d="M101 112L130 82" stroke="#f3c9a5" stroke-width="8" stroke-linecap="round"/><path d="M101 112L111 101" stroke="#5b2230" stroke-width="9" stroke-linecap="round"/><circle cx="132" cy="79" r="6" fill="#f3c9a5"/></g>
    </svg>
  </div>
  <h1>Only for you</h1>
  <p class="sm">Type the day our story began.</p>
  <div id="pw"><input class="code" id="code" inputmode="numeric" placeholder="DD MM YY" maxlength="8" autocomplete="off" aria-label="Secret date"></div>
  <button id="enter">Unlock</button>
  <p class="hand" id="hint" style="font-size:1.5rem;color:var(--gold);min-height:1.5em"></p>
  <div id="cry" style="display:none"><div class="bigcry">😭</div><p class="hand" style="font-size:1.8rem">Wrong date… Motu is crying 😭</p><button id="sorry">Say sorry to Motu 🥺</button></div>
</section>

<!-- 2. Question -->
<section id="s2">
  <h1 id="q">Do you love me?</h1>
  <p class="sm" id="qs">Be honest 🥺</p>
  <div id="btns"><button id="yes">Yes 💖</button><button id="no" class="ghost">No</button></div>
</section>

<!-- 3. Reasons -->
<section id="s3">
  <p class="hand" style="font-size:1.8rem;color:var(--gold)">Why I love you</p>
  <div class="dots" id="dots"></div>
  <div class="reason" id="reason"></div>
  <button id="next">Next 🖤</button>
</section>

<!-- 4. Memories -->
<section id="s4">
  <h1>Our memories</h1>
  <p class="sm">Every moment with you is my favourite.</p>
  <div id="gal"></div>
  <button id="toLetter">A little quiz for you 🤭</button>
</section>

<!-- Quiz -->
<section id="s6">
  <p class="hand" style="font-size:1.8rem;color:var(--gold)" id="qn">Quiz time 🤭</p>
  <h1 id="qq" style="font-size:1.8rem"></h1>
  <div id="qo" style="display:flex;flex-direction:column;gap:10px;width:100%"></div>
  <p class="hand" id="qf" style="font-size:1.6rem;min-height:2.4em;color:var(--blush)"></p>
</section>

<!-- 5. Letter -->
<section id="s5">
  <p class="hand" style="font-size:1.8rem;color:var(--gold)" id="tap">Tap the envelope</p>
  <div class="env" id="env" role="button" tabindex="0" aria-label="Open envelope">
    <div class="back"></div><div class="letter"></div><div class="front"></div><div class="flap"></div><div class="heart">💌</div>
  </div>
  <div id="letterBox" style="display:none;width:100%"></div>
  <div id="fin"></div>
</section>

const $=id=>document.getElementById(id);
const show=n=>{document.querySelectorAll('section').forEach(s=>s.classList.remove('on'));$('s'+n).classList.add('on');window.scrollTo(0,0)};

/* Music: soft music-box melody made in the browser */
let ac,playing=false,timer,step=0;
const notes=[261.6,329.6,392,523.3,392,329.6,293.7,349.2,440,587.3,440,349.2];
function tone(f,t,v=.12){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+1.6);
 o.connect(g).connect(ac.destination);o.start(t);o.stop(t+1.7)}
function tick(){tone(notes[step%notes.length],ac.currentTime);if(step%4==0){const f=notes[step%notes.length],n=ac.currentTime;tone(f/2,n,.1);tone(f*1.25,n,.05);tone(f*1.5,n+.05,.05)}step++}
function music(on){try{
 if(on){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();tick();timer=setInterval(tick,720);playing=true;$('mus').textContent='🎵 On'}
 else{clearInterval(timer);playing=false;$('mus').textContent='🎵 Off'}}catch(e){}}
$('mus').onclick=()=>music(!playing);

/* 1. Password: one attempt only */
let tried=false;
$('pimg').src=MEMORIES[2].photo;
function cry(){
 $('pw').style.display='none';$('enter').style.display='none';$('cry').style.display='block';
 document.querySelector('.stage').classList.add('sad');
 document.querySelector('.bub').innerHTML='You forgot our date? 😭'}
$('sorry').onclick=()=>{music(true);show(2)};
function unlock(){
 const v=$('code').value.replace(/\D/g,'');
 if(tried)return;if(v!==PASS){tried=true;cry();return}if(true){music(true);show(2)}
 else{const c=$('code');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  $('hint').textContent=["Hmm, not that day 🤨","Think harder, baby 🥺","Hint: it’s the 27th 🤭"][Math.floor(Math.random()*3)]}}
$('enter').onclick=unlock;$('code').onkeydown=e=>{if(e.key==='Enter')unlock()};

/* 2. Yes / No */
const noLines=["Are you sure? 🥺","Think again 😤","Wrong button, baby","Last chance 😭","Okay that was rude 🖤","Fine, just press Yes 😌"];
let nc=0,scale=1;
function dodge(){
 const no=$('no'),yes=$('yes');
 $('qs').textContent=noLines[Math.min(nc,noLines.length-1)];nc++;
 scale=Math.min(scale+.18,2);yes.style.transform='scale('+scale+')';
 const w=$('btns').clientWidth-90;no.style.left=Math.max(0,Math.random()*w)+'px';no.style.top=(Math.random()*70)+'px';
 if(nc>5){no.style.display='none'}}
$('no').onmouseenter=dodge;$('no').onclick=dodge;
$('yes').onclick=()=>{hearts();$('q').textContent="I knew it 🥰";$('qs').textContent="Now let me tell you why I love you…";
 $('btns').style.display='none';setTimeout(()=>{show(3);r=0;showReason()},1800)};

/* 3. Reasons */
let r=0;
$('dots').innerHTML=REASONS.map(()=>'<i></i>').join('');
function showReason(){
 const el=$('reason');el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');el.textContent=REASONS[r];
 document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('f',i<=r));
 $('next').textContent=r===REASONS.length-1?'See our memories 📸':'Next 🖤'}
$('next').onclick=()=>{if(r<REASONS.length-1){r++;showReason()}else{show(4)}};

/* 4. Memories */
let target=null;
function card(m,id){
 const d=document.createElement('div');d.className='photo';
 const im=document.createElement('div');im.className='im';
 if(m.photo){const g=new Image();g.src=m.photo;g.alt=m.cap;g.style.cssText='width:100%;display:block';im.style.background='none';im.appendChild(g)}else{im.style.minHeight='300px';im.textContent='📷 Tap to add photo'}
 im.onclick=()=>{target=im;$('file').click()};
 const c=document.createElement('div');c.className='cap hand';c.textContent=m.cap;
 d.append(im,c);return d}
$('file').onchange=e=>{const f=e.target.files[0];if(!f||!target)return;const rd=new FileReader();
 rd.onload=()=>{target.style.backgroundImage='url("'+rd.result+'")';target.textContent=''};rd.readAsDataURL(f);e.target.value=''};
MEMORIES.forEach(m=>$('gal').appendChild(card(m)));
let qi=0,qs=0;
$('toLetter').onclick=()=>{qi=0;qs=0;show(6);showQ()};
function showQ(){
 const Q=QUIZ[qi],box=$('qo');let done=false;
 $('qn').textContent='Question '+(qi+1)+' of '+QUIZ.length;$('qq').textContent=Q.q;$('qf').textContent='';box.innerHTML='';
 Q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='ghost';b.textContent=t;b.style.width='100%';
  b.onclick=()=>{if(done)return;done=true;const good=Q.a<0||i===Q.a;if(good)qs++;
   b.style.background=good?'#e0607e':'#4a2a38';b.style.color='#fff';$('qf').textContent=good?Q.ok:Q.no;
   setTimeout(()=>{qi++;qi<QUIZ.length?showQ():endQuiz()},1700)};
  box.appendChild(b)})}
function endQuiz(){
 $('qn').textContent='Quiz done 🎉';$('qq').textContent='You scored '+qs+' / '+QUIZ.length;
 $('qf').textContent=qs>=3?'My smart baby 🥹':'Okay, you owe me a hug 😤';
 const box=$('qo');box.innerHTML='';const b=document.createElement('button');b.textContent='Open my surprise 💌';b.onclick=()=>show(5);box.appendChild(b);if(qs>=3)hearts()}

/* 5. Envelope */
function openEnv(){
 const env=$('env');if(env.classList.contains('open'))return;env.classList.add('open');$('tap').textContent='';
 setTimeout(()=>{env.style.display='none';
  const lb=$('letterBox');lb.style.display='block';
  lb.innerHTML='<div class="paper hand"><div>Dear '+HIS_NAME+',</div><p></p><div class="sig">– '+MY_NAME+' 🖤</div></div>';
  const p=lb.querySelector('p');let i=0;
  const iv=setInterval(()=>{p.textContent=LETTER.slice(0,++i);if(i>=LETTER.length){clearInterval(iv);setTimeout(finale,900)}},28)},1800)}
$('env').onclick=openEnv;$('env').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openEnv()};
function finale(){const f=$('fin');f.appendChild(card(FAV));
 const h=document.createElement('p');h.className='hand';h.style.cssText='font-size:2rem;color:var(--blush)';h.textContent='Happy 1 year 8 months 🖤';f.appendChild(h);
 const gb=document.createElement('div');gb.style.width='100%';
 gb.innerHTML='<p class="hand" style="font-size:2rem;color:var(--gold);margin:18px 0 8px">Here is your surprise 🎁<br>Choose one gift</p><div id="gifts" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"></div><p class="hand" id="gres" style="font-size:1.7rem;color:var(--blush);min-height:3em"></p>';f.appendChild(gb);
 let picked=false;
 GIFTS.forEach(g=>{const b=document.createElement('button');b.className='ghost';b.style.borderRadius='18px';b.innerHTML='<span style="font-size:1.8rem">'+g[0]+'</span><br>'+g[1];
  b.onclick=()=>{if(picked)return;picked=true;b.style.background='#e0607e';b.style.color='#fff';
   $('gres').textContent='Your wish is my command, '+HIS_NAME+'! 🖤 Take a screenshot and send it to me. I owe you this 🥰';hearts()};
  $('gifts').appendChild(b)});
 const a=document.createElement('a');a.href='https://music.youtube.com/watch?v=82P9aa28DoE';a.target='_blank';a.rel='noopener noreferrer';a.textContent='Play our song 🎵';a.style.cssText='display:inline-block;margin:6px 0 24px;padding:.7em 1.8em;border-radius:999px;background:var(--blush);color:#2a0b17;font-weight:700;font-size:1.1rem;text-decoration:none';f.appendChild(a);
 f.classList.add('on');hearts();f.scrollIntoView({behavior:'smooth'})}

/* Falling hearts */
function hearts(){const b=$('fall');for(let i=0;i<36;i++){const s=document.createElement('span');
 s.textContent=['🖤','❤️','💖','🤍'][i%4];s.style.left=Math.random()*100+'%';s.style.fontSize=(16+Math.random()*22)+'px';
 s.style.animationDuration=(3+Math.random()*3)+'s';s.style.animationDelay=Math.random()*1.5+'s';b.appendChild(s);
 setTimeout(()=>s.remove(),7000)}}
</script>
